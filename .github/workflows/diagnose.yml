name: Diagnose crash (emulator)
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > gs.raw
            if node -e "JSON.parse(require('fs').readFileSync('gs.raw','utf8'))" 2>/dev/null; then
              cp gs.raw google-services.json
            else
              tr -d ' \r\n' < gs.raw | base64 -d > google-services.json
            fi
            rm gs.raw
          fi
          [ -s google-services.json ] || { echo "::error::google-services.json missing"; exit 1; }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-x86-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-x86-

      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install

      # x86_64 build, because the emulator on the runner is x86_64.
      - name: Gradle assembleRelease (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --build-cache

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/run-and-log.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            logcat.txt
            screen.png

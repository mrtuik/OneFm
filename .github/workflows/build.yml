name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Uses the secret if you set one, otherwise the google-services.json committed in the repo.
      - name: Validate google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > gs.raw
            if node -e "JSON.parse(require('fs').readFileSync('gs.raw','utf8'))" 2>/dev/null; then
              cp gs.raw google-services.json
            else
              tr -d ' \r\n' < gs.raw | base64 -d > google-services.json
            fi
            rm gs.raw
          fi
          if [ ! -s google-services.json ]; then
            echo "::error::google-services.json is missing. Commit it to the repo root."
            exit 1
          fi
          node -e "
            const j = JSON.parse(require('fs').readFileSync('google-services.json','utf8'));
            const ok = j.client.some(c => c.client_info.android_client_info.package_name === 'com.onefm.tuik');
            if (!ok) throw new Error('com.onefm.tuik not found in google-services.json');
            console.log('google-services.json OK');
          "

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-

      # Native sherpa-onnx libraries for the local module modules/onefm-voice (same version as the Kotlin API in Tts.kt).
      - name: Download sherpa-onnx native libraries (arm64-v8a)
        env:
          SHERPA_ONNX_VERSION: "v1.13.8"
        run: |
          D=modules/onefm-voice/android/src/main/jniLibs/arm64-v8a
          mkdir -p "$D"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}-android.tar.bz2"
          echo "Downloading $URL"
          curl -sSL "$URL" -o /tmp/sherpa-android.tar.bz2
          [ -s /tmp/sherpa-android.tar.bz2 ] || { echo "::error::Could not download $URL"; exit 1; }
          mkdir -p /tmp/sherpa_extracted
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa_extracted
          cp /tmp/sherpa_extracted/jniLibs/arm64-v8a/libsherpa-onnx-jni.so "$D/"
          cp /tmp/sherpa_extracted/jniLibs/arm64-v8a/libonnxruntime.so "$D/"
          for f in libsherpa-onnx-jni.so libonnxruntime.so; do
            [ -s "$D/$f" ] || { echo "::error::Missing native library $D/$f"; exit 1; }
            echo "Verified $f: $(wc -c < "$D/$f") bytes"
          done
          rm -rf /tmp/sherpa_extracted /tmp/sherpa-android.tar.bz2

      # Warns (does not fail) if a voice in src/voice/engine.ts is not in the sherpa-onnx tts-models release.
      - name: Verify voice model links
        run: |
          grep -o "id: '[^']*'" src/voice/engine.ts | sed "s/id: '//;s/'$//" | while read -r id; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${id}.tar.bz2")
            echo "$code $id"
            [ "$code" = "200" ] || echo "::warning::Voice model not found (HTTP $code): $id"
          done

      - run: npm install --no-audit --no-fund

      # Aligns every Expo package (expo-font, expo-notifications, icons...) to the exact
      # versions this Expo SDK expects. Mismatched native versions crash the app at launch.
      # expo-font is not in package.json (npm pulls it in as a peer of the icon library, at the
      # newest version), so --fix alone never checks it. Install it explicitly at the SDK version.
      - name: Align Expo package versions
        run: |
          npx expo install expo-font
          npx expo install --fix

      - name: Show resolved Expo versions
        run: |
          {
            echo '### Resolved versions'
            echo '```'
            npm ls expo expo-font expo-modules-core expo-notifications @expo/vector-icons 2>&1 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - run: npx expo prebuild --platform android --no-install

      # Shows up in Android Settings > Apps > One Fm, so you can tell which build is installed.
      - name: Stamp build number
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Speed up Gradle
        run: |
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> android/gradle.properties

      # Optional. Without KEYSTORE_B64 the APK is signed with the standard debug key.
      - name: Decode release keystore (if provided)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ONEFM_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "No KEYSTORE_B64 secret, using debug signing"
          fi

      # arm64-v8a only: builds the native code once instead of four times.
      - name: Gradle assembleRelease
        working-directory: android
        env:
          ONEFM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ONEFM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ONEFM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # When Gradle fails, pull the real cause (CMake, Kotlin, Java, missing symbol) out of the long log.
      - name: Show the real build error
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          {
            echo '### Real build error'
            echo '```'
            grep -n -E -A12 "CMake Error|CMake Warning \(dev\)|^e: |error: |FAILED$|What went wrong" "$LOG" | grep -v "^\s*at " | cut -c1-260 | head -120
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Prints the SHA-1 you must add in Firebase (shown in the run Summary page too).
      - name: Show SHA-1 of the APK signing key
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          keytool -printcert -jarfile "$APK" | tee cert.txt
          {
            echo '### Add this SHA-1 to Firebase (com.onefm.tuik)'
            echo '```'
            grep 'SHA1:' cert.txt | sed 's/^ *//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: onefm-apk
          path: android/app/build/outputs/apk/release/*.apk

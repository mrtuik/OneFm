name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Runs first so a bad secret fails in seconds, not after 8 minutes.
      - name: Write and validate google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GS" > gs.raw
          if node -e "JSON.parse(require('fs').readFileSync('gs.raw','utf8'))" 2>/dev/null; then
            cp gs.raw google-services.json
          else
            tr -d ' \r\n' < gs.raw | base64 -d > google-services.json
          fi
          rm gs.raw
          node -e "
            const j = JSON.parse(require('fs').readFileSync('google-services.json','utf8'));
            const ok = j.client.some(c => c.client_info.android_client_info.package_name === 'com.onefm.tuik');
            if (!ok) throw new Error('com.onefm.tuik not found in google-services.json');
            console.log('google-services.json OK');
          "

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - run: npx expo prebuild --platform android --no-install

      - name: Speed up Gradle
        run: |
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.configureondemand=true"
          } >> android/gradle.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

      # arm64-v8a only: builds the native code once instead of four times.
      - name: Gradle assembleRelease
        working-directory: android
        env:
          ONEFM_KEYSTORE: ${{ runner.temp }}/release.keystore
          ONEFM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ONEFM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ONEFM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: onefm-apk
          path: android/app/build/outputs/apk/release/*.apk
